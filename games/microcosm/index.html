<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microcosm</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.157.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="ui">
    <div id="hud">
      <span id="title">MICROCOSM</span>
      <span id="info"></span>
    </div>

    <div id="palette">
      <button class="action-btn" id="sprinkle-btn">Sprinkle</button>
      <div id="foodsize-wrap">
        <button class="action-btn" id="foodsize-btn">Food: M</button>
        <div id="foodsize-popup" class="hidden">
          <div class="popup-row">
            <button class="speed-opt" data-size="s">S</button>
            <button class="speed-opt active" data-size="m">M</button>
            <button class="speed-opt" data-size="l">L</button>
            <button class="speed-opt" data-size="r">Random</button>
          </div>
          <div class="popup-row">
            <button class="speed-opt" data-count="1">x1</button>
            <button class="speed-opt active" data-count="3">x3</button>
            <button class="speed-opt" data-count="5">x5</button>
            <button class="speed-opt" data-count="10">x10</button>
          </div>
        </div>
      </div>
      <button class="action-btn" id="add-creature-btn">+1 Creature</button>
      <div id="speed-wrap">
        <button class="action-btn" id="speed-btn">Speed x1</button>
        <div id="speed-popup" class="hidden">
          <button class="speed-opt" data-idx="0">x0.5</button>
          <button class="speed-opt active" data-idx="1">x1</button>
          <button class="speed-opt" data-idx="2">x5</button>
          <button class="speed-opt" data-idx="3">x10</button>
        </div>
      </div>
      <button class="action-btn" id="pause-btn">Pause</button>
      <button class="action-btn" id="reset-btn">Reset</button>
      <button class="action-btn mode-look" id="click-mode-btn">Click: Look</button>
    </div>

    <div id="status-panel">
      <div id="status-title">Creatures</div>
      <div id="status-list"></div>
      <button class="action-btn" id="details-btn" style="margin-top:8px;width:100%;font-size:11px">Details...</button>
    </div>

    <div id="details-overlay" class="hidden">
      <div id="details-card">
        <div id="details-header">
          <span id="details-title">Creature Details</span>
          <button class="action-btn" id="details-close-btn">Close</button>
        </div>
        <div id="details-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
